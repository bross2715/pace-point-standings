<style>
:root{--bg:#07080a;--panel:#0e1013;--panel2:#14171b;--line:#22262c;--txt:#f3f5f7;--mut:#8b929c;--green:#22d36b;--red:#ff4d4d;--brand:#b5223a;--gold:#ffc83d;--hd:"Barlow Condensed","Oswald","Arial Narrow",Impact,sans-serif;--bd:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--bd);-webkit-text-size-adjust:100%}
body{padding-bottom:calc(32px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto}
header{padding:calc(14px + env(safe-area-inset-top)) 16px 0;background:linear-gradient(180deg,#101216,#07080a)}
.brand{font-family:var(--hd);font-weight:800;font-style:italic;font-size:30px;letter-spacing:.5px;line-height:1;text-transform:uppercase}
.brand b{color:var(--brand)}
.sub{font-family:var(--hd);font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--mut);font-size:14px;margin-top:6px}
.sub em{font-style:normal;color:var(--txt)}
.next{margin-top:8px;font-size:12px;color:var(--mut)}
.next b{color:var(--gold);font-weight:600}
nav{display:flex;gap:2px;margin:12px -16px 0;padding:0 8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
nav button{flex:1 1 0;min-width:0;background:none;border:0;color:var(--mut);font-family:var(--hd);font-weight:700;font-size:clamp(11px,3.5vw,15px);letter-spacing:.2px;text-transform:uppercase;padding:13px 1px 11px;border-bottom:3px solid transparent;cursor:pointer;min-height:44px;white-space:nowrap}nav{display:flex;overflow:hidden}
nav button.on{color:var(--txt);border-bottom-color:var(--brand)}
main{padding:14px 12px}
.scrub{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px 12px;margin-bottom:12px}
.scrub .lab{display:flex;justify-content:space-between;font-family:var(--hd);font-weight:700;letter-spacing:1px;text-transform:uppercase;font-size:13px;color:var(--mut)}
.scrub .lab b{color:var(--txt)}
.scrub input{width:100%;margin:10px 0 0;accent-color:var(--brand)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:84px}
.card .k{font-family:var(--hd);font-weight:700;letter-spacing:1.2px;text-transform:uppercase;font-size:12px;color:var(--mut)}
.card .v{display:flex;align-items:center;gap:8px;margin-top:8px}
.card .nm{font-family:var(--hd);font-weight:800;font-size:20px;line-height:1;text-transform:uppercase}
.card .ex{font-size:12px;color:var(--mut);margin-top:3px}
.card .na{color:var(--mut);font-size:13px;margin-top:10px}
.plate{flex:none;display:flex;align-items:center;justify-content:center;width:54px;height:34px;border-radius:7px;border:1px solid #30343b}
.plate.dark{background:linear-gradient(180deg,#2b2e34,#16181b)}
.plate.light{background:linear-gradient(180deg,#eef1f6,#c3cad6);border-color:#aeb6c4}
.plate img{max-width:38px;max-height:24px;object-fit:contain;display:block}
.plate.sm{width:44px;height:28px;border-radius:6px}.plate.sm img{max-width:31px;max-height:19px}
.plate.lg{width:84px;height:52px;border-radius:10px}.plate.lg img{max-width:60px;max-height:38px}
.plate .fb{font-family:var(--hd);font-weight:800;font-style:italic;font-size:22px;line-height:1}
.plate.light .fb{color:#15171a}.plate.sm .fb{font-size:18px}.plate.lg .fb{font-size:34px}
.sec{font-family:var(--hd);font-weight:700;letter-spacing:1.4px;text-transform:uppercase;font-size:14px;color:var(--mut);margin:16px 2px 8px}
.row{display:grid;grid-template-columns:22px 34px 54px minmax(0,1fr) 40px 50px;align-items:center;gap:7px;padding:7px 10px 7px 8px;min-height:54px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;margin-bottom:6px;cursor:pointer}
.row.in{border-left-color:var(--brand)}
.row:active{background:var(--panel2)}
.rk{font-family:var(--hd);font-weight:800;font-size:20px;text-align:center}
.dl{font-family:var(--hd);font-weight:700;font-size:14px;text-align:center;color:var(--mut)}
.dl.up{color:var(--green)}.dl.dn{color:var(--red)}
.n1{font-family:var(--hd);font-weight:800;font-size:19px;line-height:1.05;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.n1 .st{color:var(--gold);font-size:13px;font-weight:700;margin-left:4px;letter-spacing:.3px}
.n2{font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.tm{display:inline-block;font-family:var(--hd);font-weight:700;font-size:10px;letter-spacing:.8px;border:1px solid #3a3f47;border-radius:4px;padding:0 4px;margin-left:5px;color:#c4cad2}
.tr{font-family:var(--hd);font-weight:700;font-size:15px;text-align:right;color:var(--green)}
.tr.z{color:var(--mut)}
.tr small{display:block;font-family:var(--bd);font-weight:600;font-size:9px;letter-spacing:.6px;color:var(--gold);margin-top:1px}
.pt{text-align:right}
.pt b{display:block;font-family:var(--hd);font-weight:800;font-size:22px;line-height:1}
.pt span{display:block;font-size:11px;color:var(--mut);margin-top:2px}.pt span.neg{color:var(--red)}
.more{display:block;width:100%;background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:13px;font-family:var(--hd);font-weight:700;letter-spacing:1px;text-transform:uppercase;font-size:15px;min-height:44px;cursor:pointer}
.cut{display:flex;align-items:center;gap:8px;margin:10px 0;color:var(--red);font-family:var(--hd);font-weight:800;letter-spacing:1.5px;font-size:13px;text-transform:uppercase}
.cut:before,.cut:after{content:"";flex:1;height:2px;background:var(--red)}
.crow{display:grid;grid-template-columns:22px 54px minmax(0,1fr) auto 56px;align-items:center;gap:8px;padding:7px 10px 7px 8px;min-height:54px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:10px;margin-bottom:6px;cursor:pointer}
.crow.out{border-left-color:var(--line)}
.form{font-family:var(--hd);font-weight:700;font-size:12px;letter-spacing:.8px;border-radius:999px;padding:3px 8px;border:1px solid var(--line);color:var(--mut);white-space:nowrap}
.form.hot{color:#ff3b3b;border-color:#8a2a2a;background:#260f0f}
.form.cool{color:#9fd0ff;border-color:#2f5f8f;background:#0f1d2c}.form.steady{color:var(--green);border-color:#1d6b40;background:#0c1f15}
.cg{text-align:right;font-family:var(--hd);font-weight:800;font-size:19px;line-height:1}
.cg small{display:block;font-family:var(--bd);font-weight:500;font-size:10px;color:var(--mut);margin-top:2px;letter-spacing:0}
.cg{color:var(--green)}.cg.near{color:var(--gold)}.cg.neg{color:var(--red)}
.call{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.45;color:#c9ced6;margin-bottom:12px}
.call b{color:var(--txt)}
.champ{border-color:#6a5420;background:linear-gradient(180deg,#1b160a,#0e1013)}
.srow{display:grid;grid-template-columns:24px 54px minmax(0,1fr) 52px 52px;align-items:center;gap:8px;padding:7px 10px 7px 8px;min-height:54px;background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:6px;cursor:pointer}
.srow.zero{opacity:.45}
.col{text-align:right}.col b{font-family:var(--hd);font-weight:800;font-size:21px;line-height:1;display:block}
.col span{font-size:10px;color:var(--mut);letter-spacing:.5px;text-transform:uppercase}
.lcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.lcard h3{margin:0 0 6px;font-family:var(--hd);font-weight:800;letter-spacing:1.2px;text-transform:uppercase;font-size:15px;color:var(--gold)}
.lr{display:grid;grid-template-columns:22px 44px minmax(0,1fr) auto;align-items:center;gap:8px;padding:6px 0;min-height:44px;border-top:1px solid var(--line);cursor:pointer}
.lr:first-of-type{border-top:0}
.lr .v{font-family:var(--hd);font-weight:800;font-size:20px}
.empty{color:var(--mut);font-size:13px;padding:8px 0}
.vb{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.vb button,.vc button{font-family:var(--hd);font-weight:700;letter-spacing:.8px;text-transform:uppercase;font-size:14px;color:var(--mut);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:9px 14px;min-height:40px;cursor:pointer}
.vb button.on,.vc button.on{color:var(--txt);border-color:var(--brand);background:#1a0d12}
.vb .ghost{background:none}
.vc{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}.vc button{font-size:13px;padding:7px 12px;min-height:36px}
.vn{font-size:12px;color:var(--mut);margin:-4px 2px 12px}
.rr{display:grid;grid-template-columns:26px 54px minmax(0,1fr) auto;align-items:center;gap:8px;padding:7px 10px 7px 8px;min-height:54px;background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:6px;cursor:pointer}

.sum div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.sum small{display:block;font-family:var(--hd);font-weight:700;letter-spacing:1px;text-transform:uppercase;font-size:11px;color:var(--mut)}
.sum b{display:block;font-family:var(--hd);font-weight:800;font-size:17px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.rating{font-family:var(--hd);font-weight:800;font-size:24px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.66);z-index:20;display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}

@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.dh{padding:18px 16px 16px;position:relative;border-radius:18px 18px 0 0}
.dh .x{position:absolute;right:10px;top:10px;width:44px;height:44px;border:0;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;font-size:20px;cursor:pointer}

.dh h2{margin:0;font-family:var(--hd);font-weight:800;font-style:italic;font-size:30px;text-transform:uppercase;line-height:1}
.dh .gt{font-size:12px;color:#d6dae0;margin-top:3px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tag{font-family:var(--hd);font-weight:700;letter-spacing:.8px;font-size:12px;border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:3px 9px;background:rgba(0,0,0,.28);text-transform:uppercase}
.body{padding:4px 14px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.g{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 10px}
.g b{display:block;font-family:var(--hd);font-weight:800;font-size:24px;line-height:1}
.g span{display:block;margin-top:4px;font-size:10px;letter-spacing:.7px;text-transform:uppercase;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-family:var(--hd);font-weight:700;letter-spacing:.8px;text-transform:uppercase;font-size:12px;color:var(--mut);text-align:left;padding:6px 6px;border-bottom:1px solid var(--line)}
td{padding:9px 4px;font-size:12px;border-bottom:1px solid var(--line)}

.foot{margin:22px 4px 0;font-size:11px;color:#6d747d;line-height:1.5}
.dh{position:relative}
.dh .rkb{position:absolute;top:12px;right:52px;background:rgba(0,0,0,.4);color:#fff;padding:6px 10px;border-radius:6px;font:800 22px/1 'Barlow Condensed',sans-serif;text-align:right}

.g[data-k]{cursor:pointer}
.g .rnk{display:block;font-size:10px;color:var(--mut);margin-top:4px}
.hcb{position:relative;height:6px;border-radius:3px;background:linear-gradient(90deg,#ff3b3b,#ffc83d 50%,#22d36b);margin-top:6px}
.g{position:relative}
.g .crk{position:absolute;top:8px;right:10px;font:800 24px/1 'Barlow Condensed',sans-serif}
.g .crk sup{font-size:12px;vertical-align:top;margin-left:1px}
.hcb i{position:absolute;top:-4px;width:12px;height:12px;margin-left:-6px;border-radius:50%;border:2px solid #07080a}
.hz{font:700 9px/1 'Barlow',sans-serif;letter-spacing:.12em;text-transform:uppercase;margin-top:5px}
.hz.hot{color:#ff3b3b}.hz.steady{color:#22d36b}.hz.cool{color:#9fd0ff}
#desc{margin-top:12px}
</style>
</head>

<script>
(function (root) {
  function finishPts(S, pos) {
    if (!pos) return 0;
    if (pos === 1) return S.win;
    return Math.max(1, S.second - (pos - 2) * S.step);
  }
  // Freebie (excused absence) pays the points of the spot right behind a full field.
  // Entries for a race: the race's own field when recorded, else the league field size.
  function fieldOf(D, i) { const r = D.races[i]; return r && r.field ? r.field : D.fieldSize; }
  function freebiePts(D, i) { return finishPts(D.scoring, fieldOf(D, i) + 1); }
  function stagePtsFor(S, race, car) {
    if (race.stg && race.stg[car] != null) return race.stg[car];
    let t = 0;
    (race.stages || []).forEach(function (st) {
      const i = st.indexOf(car);
      if (i >= 0 && i < S.stage.length) t += S.stage[i];
    });
    return t;
  }
  function stageWinsFor(race, car) {
    if (race.sw) return race.sw.indexOf(car) >= 0 ? 1 : 0;
    let c = 0;
    (race.stages || []).forEach(function (st) { if (st[0] === car) c++; });
    return c;
  }
  // A race counts for comeback and stage running order only when every stage lists the full field.
  function stageComplete(D, i) {
    const so = D.races[i].stgOrder || D.races[i].stages;
    return !!so && so.length > 0 && so.every(function (s) { return s.length >= 15; });
  }
  // A driver has a known stage position when the stage lists the full field or names that driver.
  function stageKnown(D, i, car) {
    const so = D.races[i].stgOrder || D.races[i].stages || [];
    return so.every(function (s) { return s.length >= fieldOf(D, i) || s.indexOf(car) >= 0; });
  }
  function avg(a) { return a.reduce(function (s, v) { return s + v; }, 0) / a.length; }

  // PACE Driver Rating, 0 to 100: 35% finishing, 30% pace, 15% spots gained from the start,
  // 20% stage points (per start, 20 is a perfect race). Comeback is a board, not part of the rating.
  function ratingOf(D, o) {
    if (!o.starts) return null;
    const F = o.fieldAvg || D.fieldSize, parts = [], cl = function (v) { return Math.max(0, Math.min(1, v)); };
    parts.push([0.35, 1 - (o.avg - 1) / (F - 1)]);
    const pr = o.pr.filter(function (v) { return v != null; });
    if (pr.length) parts.push([0.30, avg(pr)]);
    if (o.gain != null) parts.push([0.15, cl(0.5 + o.gain / (2 * (F - 1)))]);
    parts.push([0.20, cl((o.sp / o.starts) / 20)]);
    let w = 0, t = 0;
    parts.forEach(function (p) { w += p[0]; t += p[0] * cl(p[1]); });
    return 100 * t / w;
  }

  function driverStats(D, n) {
    const S = D.scoring, out = {};
    D.drivers.forEach(function (d) {
      out[d.car] = { car: d.car, d: d, fin: [], r: [], sgp: [], flc: [], fre: [], qual: [], lap: [], lapRank: [], lapPct: [], lapGap: [], stp: [], pr: [], cbr: [] };
    });
    for (let i = 0; i < n; i++) {
      const race = D.races[i], fb = freebiePts(D, i);
      const lm = race.lap || {};
      const lcars = Object.keys(lm).filter(function (c) { return lm[c] > 0; });
      const fast = lcars.length ? Math.min.apply(null, lcars.map(function (c) { return lm[c]; })) : 0;
      D.drivers.forEach(function (d) {
        const o = out[d.car], pos = race.fin[d.car] || 0;
        const lt = lm[d.car] > 0 ? lm[d.car] : 0;
        o.lap.push(lt);
        const lrk = lt ? 1 + lcars.filter(function (c) { return lm[c] < lt; }).length : 0;
        o.lapRank.push(lrk);
        // Lap pace per race: half the qualifying (starting) spot, half the race best lap rank.
        const lq = lt ? (lcars.length > 1 ? 1 - (lrk - 1) / (lcars.length - 1) : 1) : null;
        // Qualifying part: the pre race qualifying lap rank when recorded, else the starting spot.
        // Races whose order came from the Daytona Duels do not count (the Duels are not a speed measure).
        let qsc = null;
        if (race.qualSource !== 'duels') {
          const ql = race.qlap || {}, qc = Object.keys(ql).filter(function (k) { return ql[k] > 0; });
          if (qc.length) {
            if (ql[d.car] > 0) {
              const qr = 1 + qc.filter(function (k) { return ql[k] < ql[d.car]; }).length;
              qsc = qc.length > 1 ? 1 - (qr - 1) / (qc.length - 1) : 1;

    openSheet();return;
  }
  var tags=['#'+car].concat(d.team?[d.team]:[]).concat(d.plat==='PS'?['PlayStation']:d.plat==='XB'?['Xbox']:[]);
  var h='<div class="dh" style="background:linear-gradient(135deg,'+d.c1+'66,'+d.c2+' 70%)"><button class="x" id="cx" aria-label="Close">&times;</button><div class="rkb">#'+x.rank+'<span>Points rank</span></div><div class="who">'+chip(car,'lg')+'<div><h2>'+esc(d.name)+'</h2><div class="gt">'+esc(d.tag)+'</div></div></div><div class="tags">'+tags.map(function(t){return '<span class="tag">'+esc(t)+'</span>';}).join('')+'</div></div><div class="body">';
  var RK={};
  var bsl=(x.lapRank||[]).filter(function(q){return q>0;});
  var bsv=bsl.length?Math.min.apply(null,bsl):null;
  RK.rating=rankIdx(L,function(v){return v.rating;},true);
  RK.rrank=RK.rating;
  RK.pace=rankIdx(L,function(v){return paceOf(v);},true);
  RK.speed=rankIdx(L,function(v){return v.avgPaceRank;},false);
  RK.pct=rankIdx(L,function(v){return v.avgPct;},false);
  RK.bspeed=rankIdx(L,function(v){var lr=(v.lapRank||[]).filter(function(q){return q>0;});return lr.length?Math.min.apply(null,lr):null;},false);
  RK.vs=rankIdx(L,function(v){return v.fvp;},true);
  RK.gain=rankIdx(L,function(v){return v.gain;},true);
  RK.cb=rankIdx(L,function(v){return v.cb>0?v.cb:null;},true);
  RK.stg=rankIdx(L,function(v){return v.avgStg;},false);
  RK.rank=rankIdx(L,function(v){return v.rank;},false);
  RK.avg=rankIdx(L,function(v){return v.avg;},false);
  RK.avgQ=rankIdx(L,function(v){return v.avgQ;},false);
  function bar(k){
    var info=RK[k]&&RK[k][car];
    if(!info) return '';
    var p=info.n>1?(info.n-info.rank)/(info.n-1):1;
    var c=ptColor(p);
    return '<em class="crk" style="color:'+c+'">'+ord(info.rank)+'</em><div class="hcb"><i style="left:'+(p*100).toFixed(1)+'%;background:'+c+';color:'+c+'"></i></div>';
  }
  function corner(k){
    var info=RK[k]&&RK[k][car];
    if(!info) return '';
    var p=info.n>1?(info.n-info.rank)/(info.n-1):1;
    return '<em class="crk" style="color:'+ptColor(p)+'">'+ord(info.rank)+'</em>';
  }
  function g(v,l,k,extra){return '<div class="g"'+(k?' data-k="'+k+'"':'')+'><b>'+v+'</b><span>'+l+'</span>'+(extra||'')+'</div>';}
  function sg(v){return v==null?'N/A':(v>0?'+':'')+(Math.round(v*10)/10);}
  h+='<div class="sec">Season '+D.season+'</div><div class="grid">'+
    g(x.rank,'Points rank','rank')+g(x.pts,'Points','pts')+g(x.avg==null?'N/A':x.avg.toFixed(1),'Avg finish','avg',bar('avg'))+
    g(x.best?x.best:'N/A','Best','best')+g(x.worst?x.worst:'N/A','Worst','worst')+g(x.starts,'Starts','starts')+
    g(x.t5,'Top 5','t5')+g(x.t10,'Top 10','t10')+g(x.wins,'Wins','wins')+
    g(x.sw,'Stage wins','sw')+g(x.sp,'Stage pts','sp')+g(x.fl,'Fastest laps','fl')+
    g(x.avgQ==null?'N/A':x.avgQ.toFixed(1),'Avg start','avgQ',bar('avgQ'))+g(x.poles,'Poles','poles')+g(x.free,'Freebies','free')+'</div>';
  h+='<div class="sec">Advanced</div><div class="grid">'+
    g(x.rating==null?'N/A':x.rating.toFixed(1),'Rating','rating',bar('rating'))+
    g(paceOf(x)==null?'N/A':paceOf(x).toFixed(0),'Pace','pace',bar('pace'))+
    g(x.avgPaceRank==null?'N/A':x.avgPaceRank.toFixed(1),'Avg speed rank','speed',bar('speed'))+
    g(x.avgPct==null?'N/A':x.avgPct.toFixed(2)+'%','Off fastest','pct',bar('pct'))+
    g(bsv==null?'N/A':bsv,'Best speed rank','bspeed',bar('bspeed'))+
    g(sg(x.fvp),'Vs speed','vs',bar('vs'))+
    g(sg(x.gain),'Spots gained','gain',bar('gain'))+g(x.cb>0?'+'+x.cb:'N/A','Best comeback','cb',bar('cb'))+
    g(x.avgStg==null?'N/A':x.avgStg.toFixed(1),'Avg stage pos','stg',bar('stg'))+'</div>';
  // trend
  var W=320,H=120,pl=26,pr=10,pt=10,pb=18,maxP=Math.max(D.fieldSize,x.worst||1,1);
  var pts=[];
  for(var i=0;i<N;i++){ if(x.fin[i]>0) pts.push({i:i,p:x.fin[i]}); }
  function X(i){return N===1?W/2:pl+(W-pl-pr)*i/(N-1);}
  function Y(p){return pt+(H-pt-pb)*(p-1)/(maxP-1);}
  var svg='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Finish position by race">';
  [1,5,10,15,maxP].forEach(function(g){ if(g<=maxP) svg+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(g)+'" y2="'+Y(g)+'" stroke="#22262c"/><text x="'+(pl-6)+'" y="'+(Y(g)+4)+'" fill="#8b929c" font-size="10" text-anchor="end">'+g+'</text>';});
  var path='';pts.forEach(function(q,k){path+=(k?'L':'M')+X(q.i)+','+Y(q.p);});
  if(pts.length>1) svg+='<path d="'+path+'" fill="none" stroke="'+d.c1+'" stroke-width="2.5" stroke-linejoin="round"/>';
  pts.forEach(function(q){svg+='<circle cx="'+X(q.i)+'" cy="'+Y(q.p)+'" r="4" fill="'+d.c1+'" stroke="#07080a" stroke-width="1.5"/>';});
  for(var j=0;j<N;j++) svg+='<text x="'+X(j)+'" y="'+(H-3)+'" fill="#8b929c" font-size="10" text-anchor="middle">R'+(j+1)+'</text>';
  svg+='</svg>';
  h+='<div class="sec">Finish position by race</div><div class="g" style="padding:8px 6px">'+svg+'</div>';
  h+='<div class="sec">Race log</div><table><tr><th>Race</th><th>Track</th><th class="r">Start</th><th class="r">Stg</th><th class="r">Fin</th><th class="r">Lap</th><th class="r">Pts</th></tr>';
  for(var k=N-1;k>=0;k--){
    var f=x.fin[k];
    var qk=D.races[k].qual&&D.races[k].qual[car];
    h+='<tr><td>'+(k+1)+'</td><td>'+esc(trackOf(k))+'</td><td class="r">'+(qk?'P'+qk:'&ndash;')+'</td><td class="r">'+(x.stp[k][0]||x.stp[k][1]?(x.stp[k][0]||'-')+'/'+(x.stp[k][1]||'-'):'&ndash;')+'</td><td class="r">'+(f?'P'+f:(x.fre[k]?'FREE':'DNS'))+'</td><td class="r">'+(x.lap[k]?x.lap[k].toFixed(3):'&ndash;')+'</td><td class="r">'+x.r[k]+'</td></tr>';
  }
  h+='</table></div>';
  document.getElementById('sheet').innerHTML=h;
  bindFlip(DESCS);
  openSheet();
}
function bindFlip(map){
  Array.prototype.forEach.call(document.querySelectorAll('#sheet .g[data-k]'),function(el){
    el.addEventListener('click',function(){
      var k=el.getAttribute('data-k');
      if(el.getAttribute('data-open')==='1'){
        el.innerHTML=el.getAttribute('data-front');
        el.removeAttribute('data-open');
        el.style.gridColumn='';
        return;
      }
      var dd=map[k]; if(!dd) return;
      if(!el.hasAttribute('data-front')) el.setAttribute('data-front',el.innerHTML);
      el.innerHTML='<b style="font-size:14px;line-height:1.2">'+dd[0]+'</b><span style="display:block;margin-top:6px;font-size:11px;line-height:1.4;text-transform:none;letter-spacing:0;color:var(--fg,inherit)">'+dd[1]+'</span>';
      el.setAttribute('data-open','1');
      el.style.gridColumn='1 / -1';
    });
  });
}
var TDESC={
  rank:['Team rank','Position in the team standings by team points. Ties go to wins, then team name.'],
  pts:['Team points','Each race, the three best point scorers on the team count. This is those counted points added up over every race.'],
  wins:['Wins','Race wins by any driver on the team.'],
  starts:['Starts','Race starts by all team drivers added together. Freebies do not count.'],
  avg:['Avg finish','Average finishing position across every race result from the team drivers. Lower is better.'],
  best:['Best finish','The best finishing position any team driver got in any race.'],
  worst:['Worst finish','The worst finishing position any team driver got in any race.'],
  t5:['Top 5','Top five finishes by team drivers, added together across races.'],
  t10:['Top 10','Top ten finishes by team drivers, added together across races.'],
  sw:['Stage wins','Stage 1 or stage 2 wins by team drivers.'],
  sp:['Stage points','Stage points earned by every driver on the team, all season.'],
  fl:['Fastest laps','Races where a team driver set the fastest lap.'],
  avgQ:['Avg start','Average starting spot across every start by team drivers. Lower is better.'],
  poles:['Poles','Races where a team driver started on the pole.'],
  drv:['Drivers','Drivers on the team roster.'],
  rating:['Driver Rating','The average Driver Rating of the team drivers, 0 to 100. Higher is better.'],
  pace:['Pace','The average of every team driver race pace score (0 to 100). Each score is half qualifying and half race best lap rank. Higher is better.'],
  speed:['Avg speed rank','Each race ranks all cars by best race lap, 1 being quickest. This averages the ranks of every team driver across races. Lower is better.'],
  pct:['Off fastest','How far each team driver best lap was off the fastest lap of the race, as a percentage, averaged. Lower is better.'],
  bspeed:['Best speed rank','The best spot any team driver got in the lap time line up of a race. 1st means a team driver had the quickest lap. Lower is better.'],
  vs:['Vs speed','Speed rank minus finishing position, averaged over every team result. Positive means finishing better than the best lap suggested. Higher is better.'],
  gain:['Spots gained','Starting spot minus finishing spot, averaged over every team result. Positive means gaining spots. Higher is better.'],
  cb:['Best comeback','The biggest comeback by any team driver: worst stage position minus finish, in races with full stage data. Higher is better.'],
  stg:['Avg stage pos','Average position across both stages, over every team result. Lower is better.']
};
function teamDetail(name){
  var N=st.n, L=C.standings(D,N), T=C.teams(D,L);
  T.forEach(function(q){q.m=teamMetrics(q);});
  var tm=T.filter(function(q){return q.team===name;})[0];
  if(!tm) return;
  var m=tm.m;
  var BK={avg:['avg',false],avgQ:['avgQ',false],rating:['rating',true],pace:['paceScore',true],speed:['speed',false],pct:['pct',false],bspeed:['bspeed',false],vs:['vs',true],gain:['gain',true],cb:['cb',true],stg:['stg',false]};
  function info(k){
    var b=BK[k]; if(!b||m[b[0]]==null) return null;
    var key=b[0], v=m[key], pool=T.filter(function(q){return q.m[key]!=null;});
    var better=pool.filter(function(q){return b[1]?q.m[key]>v:q.m[key]<v;}).length;
    return {rank:better+1,n:pool.length};
  }
  function bar(k){
    var i=info(k); if(!i) return '';
    var p=i.n>1?(i.n-i.rank)/(i.n-1):1, c=ptColor(p);
    return '<em class="crk" style="color:'+c+'">'+ord(i.rank)+'</em><div class="hcb"><i style="left:'+(p*100).toFixed(1)+'%;background:'+c+';color:'+c+'"></i></div>';
  }
  function g(v,l,k,extra){return '<div class="g"'+(k?' data-k="'+k+'"':'')+'><b>'+v+'</b><span>'+l+'</span>'+(extra||'')+'</div>';}
  function sg(v){return v==null?'N/A':(v>0?'+':'')+(Math.round(v*10)/10);}
  function f1(v){return v==null?'N/A':v.toFixed(1);}
  var h='<div class="dh" style="background:linear-gradient(135deg,#3a1018 0%,#12141a 75%)"><button class="x" id="cx" aria-label="Close">&times;</button><div class="rkb">#'+tm.rank+'<span>Team rank</span></div><div class="who"><div><h2>'+esc(tm.team)+'</h2><div class="gt">'+tm.members.length+' drivers &middot; '+tm.pts+' team points</div></div></div><div class="tags">'+tm.members.map(function(x){return chip(x.car,'sm');}).join('')+'</div></div><div class="body">';
  h+='<div class="call" style="margin-top:12px">Ordinals and bars rank this team against the other teams. Tap any stat for the math.</div>';
  h+='<div class="sec">Season '+D.season+'</div><div class="grid">'+
    g(tm.rank,'Team rank','rank')+g(tm.pts,'Team points','pts')+g(m.wins,'Wins','wins')+
    g(m.starts,'Starts','starts')+g(f1(m.avg),'Avg finish','avg',bar('avg'))+g(m.best||'N/A','Best','best')+
    g(m.worst||'N/A','Worst','worst')+g(m.t5,'Top 5','t5')+g(m.t10,'Top 10','t10')+
    g(m.sw,'Stage wins','sw')+g(m.sp,'Stage pts','sp')+g(m.fl,'Fastest laps','fl')+
    g(f1(m.avgQ),'Avg start','avgQ',bar('avgQ'))+g(m.poles,'Poles','poles')+g(tm.members.length,'Drivers','drv')+'</div>';
  h+='<div class="sec">Advanced</div><div class="grid">'+
    g(f1(m.rating),'Rating','rating',bar('rating'))+
    g(m.paceScore==null?'N/A':m.paceScore.toFixed(0),'Pace','pace',bar('pace'))+
    g(f1(m.speed),'Avg speed rank','speed',bar('speed'))+
    g(m.pct==null?'N/A':m.pct.toFixed(2)+'%','Off fastest','pct',bar('pct'))+
    g(m.bspeed==null?'N/A':m.bspeed,'Best speed rank','bspeed',bar('bspeed'))+
    g(sg(m.vs),'Vs speed','vs',bar('vs'))+
    g(sg(m.gain),'Spots gained','gain',bar('gain'))+g(m.cb==null?'N/A':'+'+m.cb,'Best comeback','cb',bar('cb'))+
    g(f1(m.stg),'Avg stage pos','stg',bar('stg'))+'</div>';
  h+='<div class="sec">Drivers</div><div class="lcard" style="padding:4px 12px">';
  tm.members.forEach(function(x){
    h+='<div class="lr" data-car="'+esc(x.car)+'"><div class="rk" style="font-size:15px;color:var(--mut)">'+x.rank+'</div>'+chip(x.car,'sm')+'<div><div class="n1">'+esc(x.d.name)+'</div><div class="n2">'+esc(x.d.tag)+'</div></div><div class="v">'+x.tp+(x.tp!==x.pts?'<span style="display:block;font-size:10px;color:var(--mut)">of '+x.pts+'</span>':'')+'</div></div>';
  });
  h+='</div>';
  h+='<div class="sec">Race log</div><table><tr><th>Race</th><th>Track</th><th class="r">Team pts</th><th class="r">Best</th><th class="r">Avg fin</th></tr>';
  for(var k=N-1;k>=0;k--){
    var rp=tm.members.map(function(x){return x.r[k]||0;}).sort(function(a,b){return b-a;}).slice(0,3).reduce(function(s,v){return s+v;},0);
    var fk=tm.members.map(function(x){return x.fin[k];}).filter(function(v){return v>0;});
    h+='<tr><td>'+(k+1)+'</td><td>'+esc(trackOf(k))+'</td><td class="r">'+rp+'</td><td class="r">'+(fk.length?'P'+Math.min.apply(null,fk):'&ndash;')+'</td><td class="r">'+(fk.length?meanOf(fk).toFixed(1):'&ndash;')+'</td></tr>';
  }
  h+='</table></div>';
  var sh=document.getElementById('sheet');
  sh.innerHTML=h; sh.scrollTop=0;
  Array.prototype.forEach.call(document.querySelectorAll('#sheet [data-car]'),function(el){el.addEventListener('click',function(){detail(el.getAttribute('data-car'));});});
  bindFlip(TDESC);
  openSheet();
}
function openSheet(){var o=document.getElementById('ov');o.classList.add('on');document.body.style.overflow='hidden';
  document.getElementById('cx')&&(document.getElementById('cx').onclick=closeSheet);}
function closeSheet(){document.getElementById('ov').classList.remove('on');document.body.style.overflow='';}
document.getElementById('ov').addEventListener('click',function(e){if(e.target===this)closeSheet();});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet();});
function render(){
  hdr();
  var L=C.standings(D,st.n), m=document.getElementById('main');
  m.innerHTML=st.tab==='tower'?tower(L):st.tab==='results'?resultsTab(L):st.tab==='pace'?paceTab():st.tab==='chase'?chase(L):st.tab==='stage'?stage(L):st.tab==='teams'?teamsTab(L):leaders();
  Array.prototype.forEach.call(document.querySelectorAll('[data-car]'),function(el){el.addEventListener('click',function(){detail(el.getAttribute('data-car'));});});
  var r=document.getElementById('rng');
  if(r) r.addEventListener('input',function(){st.n=parseInt(r.value,10);render();var rr=document.getElementById('rng');rr&&rr.focus&&rr.focus();});
  Array.prototype.forEach.call(document.querySelectorAll('[data-v]'),function(b){b.addEventListener('click',function(){var v=b.getAttribute('data-v');if(v==='all'){st.view='all';st.vopen=false;}else{st.view=parseInt(v,10);st.vopen=true;}render();});});
  Array.prototype.forEach.call(document.querySelectorAll('[data-tk]'),function(th){th.addEventListener('click',function(){var k=th.getAttribute('data-tk');if(st.tk===k){st.trev=!st.trev;}else{st.tk=k;st.trev=false;}render();});});
  Array.prototype.forEach.call(document.querySelectorAll('[data-ps]'),function(b){b.addEventListener('click',function(){st.ps=b.getAttribute('data-ps');render();});});
  Array.prototype.forEach.call(document.querySelectorAll('[data-team]'),function(el){el.addEventListener('click',function(){teamDetail(el.getAttribute('data-team'));});});
  var vt=document.getElementById('vtog'); if(vt) vt.addEventListener('click',function(){st.vopen=!st.vopen;render();});
  var mo=document.getElementById('more'); if(mo) mo.addEventListener('click',function(){st.all=!st.all;render();});
  Array.prototype.forEach.call(document.querySelectorAll('#tabs button'),function(b){b.classList.toggle('on',b.getAttribute('data-t')===st.tab);});
}
Array.prototype.forEach.call(document.querySelectorAll('#tabs button'),function(b){b.addEventListener('click',function(){st.tab=b.getAttribute('data-t');st.view='all';st.vopen=false;render();window.scrollTo(0,0);});});
render();
})();
</script>
</body>
</html>
